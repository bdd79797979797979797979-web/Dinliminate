name: Package Dinliminate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source JavaScript
        run: node --check public/clean-app.js && node --check api/restaurant-search.js
      - name: Create source archive
        run: zip -r dinliminate-source.zip . -x ".git/*" "node_modules/*"
      - uses: actions/upload-artifact@v4
        with:
          name: dinliminate-source
          path: dinliminate-source.zip
          retention-days: 30
